<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Dice Pro Max</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #1e1b4b 0%, #060913 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
            transition: background 0.4s ease;
            overflow: hidden;
            position: relative;
        }

        #bgVideo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            display: none;
        }

        /* Канвас для конфетти */
        #confettiCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* Верхняя панель кнопок */
        .top-controls-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .top-icon-btn {
            width: 50px;
            height: 50px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.88), rgba(15, 23, 42, 0.96));
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-bottom: 3px solid rgba(0, 0, 0, 0.7);
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            backdrop-filter: blur(16px);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            color: #fff;
        }

        .top-icon-btn:hover {
            transform: translateY(-3px) scale(1.08);
            border-color: rgba(56, 189, 248, 0.8);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .top-icon-btn:active {
            transform: translateY(2px) scale(0.95);
            border-bottom-width: 1px;
        }

        .palette-btn {
            background: linear-gradient(135deg, #ef4444, #3b82f6, #a855f7, #22c55e);
        }

        /* Уголок изменения размера */
        .resize-handle {
            position: absolute;
            right: 4px;
            bottom: 4px;
            width: 24px;
            height: 24px;
            cursor: nwse-resize;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 4px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            user-select: none;
            touch-action: none;
            z-index: 30;
            transition: color 0.2s, transform 0.2s;
        }

        .resize-handle:hover {
            color: #38bdf8;
            transform: scale(1.2);
        }

        /* Всплывающие окна */
        .popup-window {
            position: fixed;
            top: 84px;
            right: 20px;
            background: rgba(13, 18, 30, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 22px;
            padding: 16px 18px 22px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            display: none;
            flex-direction: column;
            gap: 14px;
            width: 300px;
            min-width: 240px;
            min-height: 180px;
            max-width: 92vw;
            max-height: 85vh;
            text-align: left;
            z-index: 60;
            overflow: hidden;
        }

        .popup-window.open {
            display: flex;
        }

        .drag-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: grab;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            user-select: none;
            touch-action: none;
            flex-shrink: 0;
        }

        .drag-header:active {
            cursor: grabbing;
        }

        .popup-title {
            font-size: 0.78rem;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .drag-dots {
            color: #64748b;
            font-size: 0.95rem;
        }

        .close-popup-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            width: 28px;
            height: 28px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .close-popup-btn:hover {
            background: #ef4444;
            border-color: #f87171;
            color: #ffffff;
            transform: scale(1.1);
        }

        /* Главная карточка */
        .main-card {
            position: relative;
            z-index: 20;
            width: 580px;
            min-width: 320px;
            min-height: 380px;
            max-width: 95vw;
            max-height: 92vh;
            background: rgba(13, 18, 30, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 36px;
            padding: 24px 32px 30px;
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: box-shadow 0.4s ease, border-color 0.4s ease;
        }

        .main-card.jackpot-glow {
            border-color: #facc15;
            box-shadow: 0 0 70px rgba(250, 204, 21, 0.6), inset 0 0 30px rgba(250, 204, 21, 0.3);
        }

        .main-drag-handle {
            width: 100%;
            cursor: grab;
            padding: 2px 0 6px;
            user-select: none;
            touch-action: none;
            flex-shrink: 0;
        }

        .main-drag-handle:active {
            cursor: grabbing;
        }

        .drag-pill {
            width: 52px;
            height: 5px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 99px;
            margin: 0 auto 12px;
            transition: background 0.2s, width 0.2s;
        }

        .main-drag-handle:hover .drag-pill {
            background: #38bdf8;
            width: 72px;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 900;
            margin-bottom: 4px;
            letter-spacing: 0.8px;
            background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            font-size: 2.2rem;
            -webkit-text-fill-color: initial;
            filter: drop-shadow(0 4px 12px rgba(99, 102, 241, 0.5));
        }

        .top-credit {
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 16px;
        }

        .top-credit a {
            color: #38bdf8;
            text-decoration: none;
        }

        .top-credit a:hover {
            text-decoration: underline;
        }

        .settings-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 6px;
        }

        .control-label {
            font-size: 0.74rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding-left: 2px;
        }

        .styled-select {
            appearance: none;
            -webkit-appearance: none;
            background-color: rgba(30, 41, 59, 0.85);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 16px;
            padding: 11px 32px 11px 14px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            outline: none;
            transition: all 0.2s;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
        }

        .styled-select:hover, .styled-select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
            background-color: rgba(30, 41, 59, 0.98);
        }

        .styled-select optgroup {
            background-color: #0f172a;
            color: #94a3b8;
        }

        .styled-select option {
            background-color: #1e293b;
            color: #ffffff;
        }

        /* Баннер статуса */
        .combo-banner {
            min-height: 24px;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            color: #64748b;
            margin-top: 6px;
            transition: all 0.25s ease;
        }

        .combo-banner.win {
            color: #facc15;
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.7);
            transform: scale(1.06);
        }

        /* Арена кубиков */
        .dice-arena {
            flex: 1;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
            margin: 14px 0;
            padding: 10px;
            overflow-y: auto;
        }

        .dice {
            width: var(--dice-size, 82px);
            height: var(--dice-size, 82px);
            border-radius: 24%;
            border: 3px solid rgba(255, 255, 255, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 32px rgba(0, 0, 0, 0.55), inset 0 3px 8px rgba(255, 255, 255, 0.45);
            position: relative;
            user-select: none;
            transition: background-color 0.07s linear, transform 0.18s ease, box-shadow 0.2s ease;
            animation-duration: var(--anim-dur, 0.45s);
            animation-fill-mode: both;
        }

        .dice.rolling {
            animation: diceShake 0.13s infinite alternate ease-in-out;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
        }

        @keyframes diceShake {
            0% { transform: scale(0.95) rotate(-6deg); }
            100% { transform: scale(1.05) rotate(6deg); }
        }

        .dice-dot {
            width: 22%;
            height: 22%;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
        }

        /* Анимации финиша */
        .anim-bounce { animation-name: animBounce; animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes animBounce {
            0% { transform: scale(0.5) rotate(-15deg); }
            65% { transform: scale(1.15) rotate(4deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .anim-spin { animation-name: animSpin; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes animSpin {
            0% { transform: scale(0.4) rotate(-360deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .anim-flip { animation-name: animFlip; animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes animFlip {
            0% { transform: perspective(400px) rotateY(180deg) scale(0.6); }
            100% { transform: perspective(400px) rotateY(0deg) scale(1); }
        }

        .anim-drop { animation-name: animDrop; animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes animDrop {
            0% { transform: translateY(-40px) scale(0.8); }
            100% { transform: translateY(0) scale(1); }
        }

        .anim-flash { animation-name: animFlash; animation-timing-function: ease-out; }
        @keyframes animFlash {
            0% { transform: scale(1.35); filter: brightness(2.5); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* Кнопки управления */
        .buttons-wrapper {
            flex-shrink: 0;
        }

        #rollBtn {
            width: 100%;
            padding: 17px;
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #4338ca 100%);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-bottom: 5px solid rgba(25, 22, 60, 0.9);
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 15px 32px rgba(99, 102, 241, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.45);
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
            transition: transform 0.14s ease, filter 0.2s ease, box-shadow 0.2s ease;
        }

        #rollBtn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.32), transparent);
            transition: left 0.6s ease;
        }

        #rollBtn:hover::after {
            left: 140%;
        }

        #rollBtn:hover {
            filter: brightness(1.12);
            transform: translateY(-2px);
            box-shadow: 0 18px 38px rgba(99, 102, 241, 0.65), inset 0 1px 2px rgba(255, 255, 255, 0.55);
        }

        #rollBtn:active {
            transform: translateY(3px) scale(0.98);
            border-bottom-width: 1px;
        }

        .speed-buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
        }

        .speed-btn {
            padding: 13px 14px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #f8fafc;
            background: linear-gradient(180deg, rgba(51, 65, 85, 0.9) 0%, rgba(30, 41, 59, 0.98) 100%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-bottom: 3.5px solid rgba(15, 23, 42, 0.95);
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.16s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .speed-btn:hover {
            background: linear-gradient(180deg, rgba(71, 85, 105, 0.98) 0%, rgba(30, 41, 59, 1) 100%);
            border-color: rgba(56, 189, 248, 0.75);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(56, 189, 248, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .speed-btn:active {
            transform: translateY(2px) scale(0.97);
            border-bottom-width: 1px;
        }

        .btn-active-mode {
            border-color: #38bdf8 !important;
            background: linear-gradient(180deg, rgba(14, 165, 233, 0.4) 0%, rgba(30, 41, 59, 0.98) 100%) !important;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6) !important;
        }

        /* История бросков */
        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding-right: 4px;
        }

        .history-item {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 9px 12px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .history-item.combo-hit {
            border-color: rgba(250, 204, 21, 0.6);
            background: rgba(250, 204, 21, 0.12);
        }

        .history-colors {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .history-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.8);
        }

        .history-badge {
            font-size: 0.72rem;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        .clear-history-btn {
            background: linear-gradient(180deg, rgba(239, 68, 68, 0.32), rgba(185, 28, 28, 0.45));
            border: 1px solid rgba(239, 68, 68, 0.55);
            color: #fecaca;
            border-radius: 12px;
            padding: 9px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            flex-shrink: 0;
            transition: all 0.15s;
        }

        .clear-history-btn:hover {
            background: rgba(239, 68, 68, 0.6);
            color: #fff;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay loop muted playsinline></video>
    <canvas id="confettiCanvas"></canvas>

    <!-- Верхняя панель кнопок -->
    <div class="top-controls-bar">
        <button type="button" class="top-icon-btn" id="resetPosBtn" title="Сбросить размер и позицию окон">🎯</button>
        <button type="button" class="top-icon-btn" id="historyToggleBtn" title="История бросков">📜</button>
        <button type="button" class="top-icon-btn" id="volumeToggleBtn" title="Звуки и громкость">🔊</button>
        <button type="button" class="top-icon-btn palette-btn" id="paletteToggleBtn" title="Палитра тем и фонов">🎨</button>
    </div>

    <!-- Окно 1: История бросков -->
    <div class="popup-window" id="historyPopup" style="right: 142px;">
        <div class="drag-header" data-drag-target="historyPopup">
            <div class="popup-title"><span class="drag-dots">⋮⋮</span> 📜 История бросков</div>
            <button type="button" class="close-popup-btn" data-close="historyPopup">✕</button>
        </div>
        <div class="history-list" id="historyList">
            <div style="color: #94a3b8; font-size: 0.8rem; text-align: center; padding: 10px;">Бросков еще не было</div>
        </div>
        <button type="button" class="clear-history-btn" id="clearHistoryBtn">Очистить историю</button>
        <div class="resize-handle" data-resize-target="historyPopup" title="Потяните, чтобы изменить размер">◢</div>
    </div>

    <!-- Окно 2: Звук и громкость -->
    <div class="popup-window" id="volumePopup" style="right: 80px;">
        <div class="drag-header" data-drag-target="volumePopup">
            <div class="popup-title"><span class="drag-dots">⋮⋮</span> 🔊 Звук и микшер</div>
            <button type="button" class="close-popup-btn" data-close="volumePopup">✕</button>
        </div>
        <div class="popup-title">Громкость</div>
        <input type="range" id="volumeRange" min="0" max="1" step="0.05" value="0.7">

        <div class="popup-title" style="margin-top: 4px;">🎵 Звук броска</div>
        <select id="soundSelect" class="styled-select">
            <optgroup label="Встроенные звуки">
                <option value="bubble" selected>🫧 Бабл-гам (Пузырьки)</option>
                <option value="dice">🎲 Классические кубики</option>
                <option value="roulette">🎰 Колесо фортуны</option>
                <option value="magic">✨ Магия (Колокольчики)</option>
                <option value="retro">👾 8-бит Аркада</option>
                <option value="space">🛸 Космический лазер</option>
                <option value="mute">🔇 Без звука</option>
            </optgroup>
            <optgroup label="Свой файл" id="customSoundGroup">
                <option value="upload_sound">📁 Загрузить свой звук...</option>
            </optgroup>
        </select>
        <div class="resize-handle" data-resize-target="volumePopup" title="Потяните, чтобы изменить размер">◢</div>
    </div>

    <!-- Окно 3: Палитра и темы -->
    <div class="popup-window" id="palettePopup" style="right: 20px;">
        <div class="drag-header" data-drag-target="palettePopup">
            <div class="popup-title"><span class="drag-dots">⋮⋮</span> 🎨 Темы и цвета</div>
            <button type="button" class="close-popup-btn" data-close="palettePopup">✕</button>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(30,41,59,0.75); padding: 10px 12px; border-radius: 14px;">
            <span style="font-size: 0.82rem; font-weight: 600;">RGB Цветовой тон</span>
            <input type="color" id="colorPickerInput" value="#6366f1" style="width: 34px; height: 34px; border: none; cursor: pointer; background: none;">
        </div>

        <div class="popup-title" style="margin-top: 4px;">🌌 Тема оформления</div>
        <select id="themeSelect" class="styled-select">
            <optgroup label="Космические темы">
                <option value="space">🌌 [🟣 Космос] Звезды</option>
                <option value="saturn">🪐 [🟠 Сатурн] Планета</option>
                <option value="neptune">🌊 [🔵 Нептун] Океан</option>
            </optgroup>
            <optgroup label="Неоновые & Кибер">
                <option value="cyber">⚡ [🟣 Киберпанк] Неон</option>
                <option value="neon">🟢 [🟢 Неон] Изумруд</option>

        const diceColors = [

        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let confettiParticles = [];

        let customAudio = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti() {
            confettiParticles = [];
            const colorsList = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7', '#ec4899', '#38bdf8', '#facc15'];
            for (let i = 0; i < 150; i++) {
                confettiParticles.push({
                    x: window.innerWidth / 2 + (Math.random() - 0.5) * 100,
                    y: window.innerHeight / 2 + (Math.random() - 0.5) * 50,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 0.7) * 16 - 4,
                    size: Math.random() * 8 + 5,
                    color: colorsList[Math.floor(Math.random() * colorsList.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 12,
                    gravity: 0.45,
                    opacity: 1
                });
            }
            if (!confettiAnimationId) animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confettiParticles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.rotation += p.vRot;
                p.opacity -= 0.008;

                if (p.opacity <= 0 || p.y > canvas.height) {
                    confettiParticles.splice(idx, 1);
                    return;
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.globalAlpha = Math.max(0, p.opacity);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                ctx.restore();
            });

            if (confettiParticles.length > 0) {
                confettiAnimationId = requestAnimationFrame(animateConfetti);
            } else {
                confettiAnimationId = null;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function bringToFront(el) {
            if (!el || el.id === 'mainCard') return;
            topZIndex++;
            el.style.zIndex = topZIndex;
        }

        document.querySelectorAll('.popup-window').forEach(win => {
            win.addEventListener('mousedown', () => bringToFront(win));
            win.addEventListener('touchstart', () => bringToFront(win), { passive: true });
        });

        // Перетаскивание окон
        document.querySelectorAll('[data-drag-target]').forEach(handle => {
            const targetId = handle.getAttribute('data-drag-target');
            const targetEl = document.getElementById(targetId);
            if (!targetEl) return;

            let isDragging = false;
            let startX = 0, startY = 0;
            let origLeft = 0, origTop = 0;

            function onStart(clientX, clientY) {
                isDragging = true;
                bringToFront(targetEl);
                const rect = targetEl.getBoundingClientRect();
                targetEl.style.position = 'fixed';
                targetEl.style.margin = '0';
                targetEl.style.left = rect.left + 'px';
                targetEl.style.top = rect.top + 'px';
                targetEl.style.right = 'auto';
                targetEl.style.bottom = 'auto';
                startX = clientX; startY = clientY;
                origLeft = rect.left; origTop = rect.top;
            }

            function onMove(clientX, clientY) {
                if (!isDragging) return;
                let newLeft = origLeft + (clientX - startX);
                let newTop = origTop + (clientY - startY);
                const maxLeft = window.innerWidth - 60;
                const maxTop = window.innerHeight - 50;
                newLeft = Math.max(-targetEl.offsetWidth + 60, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));
                targetEl.style.left = newLeft + 'px';
                targetEl.style.top = newTop + 'px';
            }

            function onEnd() { isDragging = false; }

            handle.addEventListener('mousedown', (e) => {
                if (e.target.closest('button, a, input, select')) return;
                e.preventDefault(); onStart(e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', onEnd);

            handle.addEventListener('touchstart', (e) => {
                if (e.target.closest('button, a, input, select')) return;
                const t = e.touches[0]; onStart(t.clientX, t.clientY);
            }, { passive: true });
            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const t = e.touches[0]; onMove(t.clientX, t.clientY);
            }, { passive: true });
            window.addEventListener('touchend', onEnd);
        });

        // Ресайз окон
        function updateDiceScale() {
            const w = mainCard.offsetWidth;
            const h = mainCard.offsetHeight;
            const scaleFactor = Math.min(w / 580, h / 450);
            const size = Math.max(48, Math.min(140, Math.round(82 * scaleFactor)));
            mainCard.style.setProperty('--dice-size', size + 'px');
        }

        document.querySelectorAll('[data-resize-target]').forEach(resizer => {
            const targetId = resizer.getAttribute('data-resize-target');
            const targetEl = document.getElementById(targetId);
            if (!targetEl) return;

            let isResizing = false;
            let startX = 0, startY = 0;
            let startW = 0, startH = 0;

            function onResizeStart(clientX, clientY) {
                isResizing = true;
                bringToFront(targetEl);
                const rect = targetEl.getBoundingClientRect();
                targetEl.style.position = 'fixed';
                targetEl.style.margin = '0';
                targetEl.style.left = rect.left + 'px';
                targetEl.style.top = rect.top + 'px';
                targetEl.style.right = 'auto';
                targetEl.style.bottom = 'auto';
                startX = clientX; startY = clientY;
                startW = rect.width; startH = rect.height;
            }

            function onResizeMove(clientX, clientY) {
                if (!isResizing) return;
                const newW = Math.max(250, Math.min(window.innerWidth - 20, startW + (clientX - startX)));
                const newH = Math.max(190, Math.min(window.innerHeight - 20, startH + (clientY - startY)));
                targetEl.style.width = newW + 'px';
                targetEl.style.height = newH + 'px';
                if (targetEl.id === 'mainCard') updateDiceScale();
            }

            function onResizeEnd() { isResizing = false; }

            resizer.addEventListener('mousedown', (e) => { e.preventDefault(); e.stopPropagation(); onResizeStart(e.clientX, e.clientY); });
            window.addEventListener('mousemove', (e) => onResizeMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', onResizeEnd);
            resizer.addEventListener('touchstart', (e) => { e.stopPropagation(); const t = e.touches[0]; onResizeStart(t.clientX, t.clientY); }, { passive: true });
            window.addEventListener('touchmove', (e) => { if (!isResizing) return; const t = e.touches[0]; onResizeMove(t.clientX, t.clientY); }, { passive: true });
            window.addEventListener('touchend', onResizeEnd);
        });

        function togglePopup(popup) {
            const isOpen = popup.classList.contains('open');
            if (!isOpen) { popup.classList.add('open'); bringToFront(popup); }
            else { popup.classList.remove('open'); }
        }

        historyToggleBtn.addEventListener('click', () => togglePopup(historyPopup));
        volumeToggleBtn.addEventListener('click', () => togglePopup(volumePopup));
        paletteToggleBtn.addEventListener('click', () => togglePopup(palettePopup));

        document.querySelectorAll('[data-close]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById(btn.getAttribute('data-close'))?.classList.remove('open');
            });
        });

        document.getElementById('resetPosBtn').addEventListener('click', () => {
            mainCard.style.position = 'relative';
            mainCard.style.left = ''; mainCard.style.top = '';
            mainCard.style.width = '580px'; mainCard.style.height = '';
            updateDiceScale();
            const offsets = [142, 80, 20];
            ['historyPopup', 'volumePopup', 'palettePopup'].forEach((id, i) => {
                const w = document.getElementById(id);
                w.style.left = 'auto'; w.style.top = '84px'; w.style.right = offsets[i] + 'px';
                w.style.width = '300px'; w.style.height = '';
            });
        });

        // История бросков
        clearHistoryBtn.addEventListener('click', () => { rollHistory = []; updateHistoryUI(); });

        function addCurrentRollToHistory(rolledData, mode, isCombo) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const modeLabel = mode === 'fast' ? '⚡' : mode === 'slow' ? '🐢' : '🎲';
            rollHistory.unshift({ time: timeStr, dice: rolledData, modeLabel, isCombo });
            if (rollHistory.length > 25) rollHistory.length = 25;
            updateHistoryUI();
        }

        function updateHistoryUI() {
            if (rollHistory.length === 0) {
                historyList.innerHTML = '<div style="color: #94a3b8; font-size: 0.8rem; text-align: center; padding: 10px;">Бросков еще не было</div>';
                return;
            }
            historyList.innerHTML = '';
            rollHistory.forEach(item => {
                const el = document.createElement('div');
                el.className = 'history-item' + (item.isCombo ? ' combo-hit' : '');
                const colorsContainer = document.createElement('div');
                colorsContainer.className = 'history-colors';
                item.dice.forEach(d => {
                    const dot = document.createElement('div');
                    dot.className = 'history-dot';
                    dot.style.backgroundColor = d.hex;
                    dot.title = d.name;
                    colorsContainer.appendChild(dot);
                });
                const rightBox = document.createElement('div');
                rightBox.style.display = 'flex'; rightBox.style.alignItems = 'center'; rightBox.style.gap = '6px';
                if (item.isCombo) {
                    const comboTag = document.createElement('span');
                    comboTag.className = 'history-badge'; comboTag.style.color = '#facc15';
                    comboTag.textContent = '🎉 САЛЮТ'; rightBox.appendChild(comboTag);
                }
                const badge = document.createElement('span'); badge.className = 'history-badge'; badge.textContent = item.modeLabel;
                const timeEl = document.createElement('span'); timeEl.style.color = '#94a3b8'; timeEl.style.fontSize = '0.74rem'; timeEl.textContent = item.time;
                rightBox.appendChild(badge); rightBox.appendChild(timeEl);
                el.appendChild(colorsContainer); el.appendChild(rightBox);
                historyList.appendChild(el);
            });
        }

        // Звуки
        function stopAllSounds() {
            if (stopSoundTimeout) { clearTimeout(stopSoundTimeout); stopSoundTimeout = null; }
            if (customAudio) { customAudio.pause(); customAudio.currentTime = 0; }
            activeOscillators.forEach(osc => { try { osc.stop(); } catch (e) {} });
            activeOscillators = [];
        }

        function playTickSound(pitchOffset = 0) {
            const soundType = soundSelect.value;
            if (soundType === 'mute' || soundType === 'upload_sound') return;
            const vol = parseFloat(volumeRange.value) * 0.4;
            if (vol <= 0) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(520 + pitchOffset, now);
            gain.gain.setValueAtTime(vol * 0.25, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.035);
            activeOscillators.push(osc);
        }

        function playRollSound(speed = 'normal') {
            stopAllSounds();
            const soundType = soundSelect.value;
            if (soundType === 'mute' || soundType === 'upload_sound') return;
            const vol = parseFloat(volumeRange.value);
            const cutTime = speed === 'fast' ? 200 : speed === 'step' ? 320 : 480;

            if (soundType === 'custom' && customAudio) {
                customAudio.volume = vol; customAudio.play().catch(() => {});
                stopSoundTimeout = setTimeout(() => stopAllSounds(), cutTime);
                return;
            }
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (soundType === 'bubble') {
                for (let idx = 0; idx < 4; idx++) {
                    const delay = idx * 0.08;
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(320 + idx * 140, now + delay);
                    osc.frequency.exponentialRampToValueAtTime(720 + idx * 160, now + delay + 0.07);
                    gain.gain.setValueAtTime(0.25 * vol, now + delay); gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.08);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + delay); osc.stop(now + delay + 0.09); activeOscillators.push(osc);
                }
            } else if (soundType === 'dice') {
                for (let idx = 0; idx < 4; idx++) {
                    const delay = idx * 0.07;
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(280 + idx * 65, now + delay);
                    osc.frequency.exponentialRampToValueAtTime(90, now + delay + 0.06);
                    gain.gain.setValueAtTime(0.3 * vol, now + delay); gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.06);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + delay); osc.stop(now + delay + 0.065); activeOscillators.push(osc);
                }
            } else if (soundType === 'roulette') {
                for (let i = 0; i < 8; i++) {
                    const delay = i * 0.03;
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, now + delay);
                    gain.gain.setValueAtTime(0.2 * vol, now + delay); gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.025);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + delay); osc.stop(now + delay + 0.03); activeOscillators.push(osc);
                }
            } else if (soundType === 'magic') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const delay = idx * 0.06;
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now + delay);
                    gain.gain.setValueAtTime(0.18 * vol, now + delay); gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.22);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + delay); osc.stop(now + delay + 0.24); activeOscillators.push(osc);
                });
            } else if (soundType === 'retro') {
                [261.63, 329.63, 392.00, 523.25].forEach((freq, idx) => {
                    const delay = idx * 0.05;
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'square'; osc.frequency.setValueAtTime(freq, now + delay);
                    gain.gain.setValueAtTime(0.1 * vol, now + delay); gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.06);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + delay); osc.stop(now + delay + 0.065); activeOscillators.push(osc);
                });
            } else if (soundType === 'space') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.22);
                gain.gain.setValueAtTime(0.25 * vol, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.28); activeOscillators.push(osc);
            }
        }

        // Логика роллов
        function clearActiveRollProcesses() {
            activeTimers.forEach(id => clearTimeout(id)); activeTimers = [];
            activeIntervals.forEach(id => clearInterval(id)); activeIntervals = [];
            rollBtn.classList.remove('btn-active-mode');
            fastRollBtn.classList.remove('btn-active-mode');
            slowRollBtn.classList.remove('btn-active-mode');
        }

        function getRandomColor(excludeHex = null) {
            let pool = excludeHex ? diceColors.filter(c => c.hex !== excludeHex) : diceColors;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function checkCombo(finalColors) {
            mainCard.classList.remove('jackpot-glow');
            const counts = {};
            finalColors.forEach(c => { counts[c.hex] = (counts[c.hex] || 0) + 1; });

            let maxSame = 0;
            let dominantColorName = '';
            for (let hex in counts) {
                if (counts[hex] > maxSame) {
                    maxSame = counts[hex];
                    const found = finalColors.find(c => c.hex === hex);
                    dominantColorName = found ? found.name : '';
                }
            }

            if (maxSame >= 4 || (finalColors.length >= 3 && finalColors.every(c => c.hex === finalColors[0].hex))) {
                mainCard.classList.add('jackpot-glow');
                comboBanner.textContent = `🎉 САЛЮТ! ВЫПАЛО ${maxSame} КУБИКА (${dominantColorName})!`;
                comboBanner.classList.add('win');
                triggerConfetti();
                return true;
            }

            comboBanner.classList.remove('win');
            comboBanner.textContent = 'Собери 4+ одинаковых цвета для салюта! 🎉';
            return false;
        }

        function createBaseDice() {
            const diceEl = document.createElement('div');
            diceEl.className = 'dice';
            const dot = document.createElement('div');
            dot.className = 'dice-dot';
            diceEl.appendChild(dot);
            return diceEl;
        }

        function finalizeDice(diceEl, colorObj, animDuration) {
            const animType = animSelect.value;
            diceEl.classList.remove('rolling');
            diceEl.style.backgroundColor = colorObj.hex;
            diceEl.style.setProperty('--anim-dur', `${animDuration}s`);
            void diceEl.offsetWidth;
            diceEl.classList.add(`anim-${animType}`, 'locked');
        }

        function rollDice(withSound = true, mode = 'normal', saveHistory = true) {
            clearActiveRollProcesses();
            currentRollId++;
            const rollId = currentRollId;
            const count = parseInt(diceCountSelect.value, 10);
            diceArena.innerHTML = '';

            const finalColors = Array.from({ length: count }, () => getRandomColor());
            const diceElements = [];

            for (let i = 0; i < count; i++) {
                const el = createBaseDice();
                el.style.backgroundColor = getRandomColor().hex;
                diceArena.appendChild(el);
                diceElements.push(el);
            }

            if (mode === 'fast') {
                fastRollBtn.classList.add('btn-active-mode');
                if (withSound) playRollSound('fast');
                diceElements.forEach((el, idx) => finalizeDice(el, finalColors[idx], 0.16));
                activeTimers.push(setTimeout(() => { if (rollId === currentRollId) fastRollBtn.classList.remove('btn-active-mode'); }, 220));
                const isCombo = checkCombo(finalColors);
                if (saveHistory) addCurrentRollToHistory(finalColors, 'fast', isCombo);
                return;
            }

            if (mode === 'normal') {
                rollBtn.classList.add('btn-active-mode');
                diceElements.forEach(el => el.classList.add('rolling'));
                let lastHex = null;
                const shuffleInt = setInterval(() => {
                    if (rollId !== currentRollId) return;
                    diceElements.forEach(el => {
                        const c = getRandomColor(lastHex); lastHex = c.hex; el.style.backgroundColor = c.hex;
                    });
                    if (withSound) playTickSound(120);
                }, 65);
                activeIntervals.push(shuffleInt);

                diceElements.forEach((el, idx) => {
                    activeTimers.push(setTimeout(() => {
                        if (rollId !== currentRollId) return;
                        if (idx === 0 && withSound) playRollSound('normal');
                        finalizeDice(el, finalColors[idx], 0.42);
                        if (idx === count - 1) {
                            clearInterval(shuffleInt);
                            rollBtn.classList.remove('btn-active-mode');
                            const isCombo = checkCombo(finalColors);
                            if (saveHistory) addCurrentRollToHistory(finalColors, 'normal', isCombo);
                        }
                    }, 300 + idx * 75));
                });
                return;
            }

            if (mode === 'slow') {
                slowRollBtn.classList.add('btn-active-mode');
                diceElements.forEach(el => el.classList.add('rolling'));
                const bgShuffle = setInterval(() => {
                    if (rollId !== currentRollId) return;
                    diceElements.forEach(el => { el.style.backgroundColor = getRandomColor().hex; });
                }, 90);
                activeIntervals.push(bgShuffle);

                diceElements.forEach((el, idx) => {
                    const baseDelay = 520 + idx * 620;
                    [baseDelay - 240, baseDelay - 120].forEach(t => {
                        activeTimers.push(setTimeout(() => {
                            if (rollId !== currentRollId) return;
                            el.style.backgroundColor = getRandomColor().hex;
                            if (withSound) playTickSound(150);
                        }, t));
                    });
                    activeTimers.push(setTimeout(() => {
                        if (rollId !== currentRollId) return;
                        if (withSound) playRollSound('step');
                        finalizeDice(el, finalColors[idx], 0.55);
                        if (idx === count - 1) {
                            clearInterval(bgShuffle);
                            slowRollBtn.classList.remove('btn-active-mode');
                            const isCombo = checkCombo(finalColors);
                            if (saveHistory) addCurrentRollToHistory(finalColors, 'slow', isCombo);
                        }
                    }, baseDelay));
                });
            }
        }

        rollBtn.addEventListener('click', () => rollDice(true, 'normal', true));
        fastRollBtn.addEventListener('click', () => rollDice(true, 'fast', true));
        slowRollBtn.addEventListener('click', () => rollDice(true, 'slow', true));

        // Кнопка быстрого сброса
        clearArenaBtn.addEventListener('click', () => {
            rollDice(true, 'fast', false);
        });

        diceCountSelect.addEventListener('change', () => rollDice(true, 'fast', false));
        animSelect.addEventListener('change', () => rollDice(true, 'fast', false));

        volumeRange.addEventListener('input', () => {
            if (customAudio) customAudio.volume = parseFloat(volumeRange.value);
        });

        // Бросок по пробелу
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !['BUTTON', 'SELECT', 'INPUT'].includes(document.activeElement.tagName)) {
                e.preventDefault(); rollDice(true, 'normal', true);
            }
        });

        soundSelect.addEventListener('change', (e) => {
            if (e.target.value === 'upload_sound') {
                soundSelect.value = lastValidSound; soundInput.click();
            } else {
                lastValidSound = e.target.value; playRollSound('normal');
            }
        });

        colorPickerInput.addEventListener('input', (e) => {
            const col = e.target.value;
            bgVideo.style.display = 'none'; bgVideo.src = '';
            document.body.style.background = `radial-gradient(circle at center, ${col}44 0%, #060913 100%)`;
            rollBtn.style.background = `linear-gradient(135deg, ${col} 0%, #0f172a 100%)`;
        });

        themeSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'upload_image') { themeSelect.value = lastValidTheme; bgImageInput.click(); return; }
            if (val === 'upload_video') { themeSelect.value = lastValidTheme; bgVideoInput.click(); return; }
            lastValidTheme = val;
            if (savedBackgrounds[val]) {
                const bg = savedBackgrounds[val];
                if (bg.type === 'image') {
                    bgVideo.style.display = 'none'; bgVideo.src = '';
                    document.body.style.background = `url('${bg.url}') center / cover no-repeat fixed`;
                } else if (bg.type === 'video') {
                    document.body.style.background = '#060913';
                    bgVideo.src = bg.url; bgVideo.style.display = 'block';
                }
                return;
            }
            bgVideo.style.display = 'none'; bgVideo.src = '';
            applyTheme(val);
        });

        function applyTheme(theme) {
            let btnBg = 'linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #4338ca 100%)';
            if (theme === 'space') {
                document.body.style.background = 'radial-gradient(circle at center, #1e1b4b 0%, #060913 100%)';
            } else if (theme === 'saturn') {
                document.body.style.background = 'radial-gradient(ellipse at center, #fef08a 0%, #d97706 40%, #291102 100%)';
                btnBg = 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)';
            } else if (theme === 'neptune') {
                document.body.style.background = 'linear-gradient(135deg, #020617 0%, #1d4ed8 50%, #06b6d4 100%)';
                btnBg = 'linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%)';
            } else if (theme === 'cyber') {
                document.body.style.background = 'linear-gradient(135deg, #09090b 0%, #3b0764 50%, #831843 100%)';
                btnBg = 'linear-gradient(135deg, #a855f7 0%, #7e22ce 100%)';
            } else if (theme === 'neon') {
                document.body.style.background = 'linear-gradient(135deg, #022c22 0%, #064e3b 50%, #022f26 100%)';
                btnBg = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
            } else if (theme === 'cyberarctic') {
                document.body.style.background = 'linear-gradient(135deg, #082f49 0%, #0369a1 50%, #164e63 100%)';
                btnBg = 'linear-gradient(135deg, #38bdf8 0%, #0284c7 100%)';
            } else if (theme === 'pinkneon') {
                document.body.style.background = 'linear-gradient(135deg, #4c0519 0%, #be185d 50%, #831843 100%)';
                btnBg = 'linear-gradient(135deg, #ec4899 0%, #be185d 100%)';
            } else if (theme === 'sunset') {
                document.body.style.background = 'linear-gradient(180deg, #2e1065 0%, #701a75 50%, #9a3412 100%)';
                btnBg = 'linear-gradient(135deg, #ea580c 0%, #c2410c 100%)';
            } else if (theme === 'forest') {
                document.body.style.background = 'linear-gradient(180deg, #052e16 0%, #15803d 60%, #166534 100%)';
                btnBg = 'linear-gradient(135deg, #22c55e 0%, #15803d 100%)';
            } else if (theme === 'fire') {
                document.body.style.background = 'linear-gradient(135deg, #450a0a 0%, #c2410c 50%, #7c2d12 100%)';
                btnBg = 'linear-gradient(135deg, #ef4444 0%, #b91c1c 100%)';
            } else if (theme === 'gold') {
                document.body.style.background = 'linear-gradient(180deg, #18181b 0%, #713f12 50%, #27272a 100%)';
                btnBg = 'linear-gradient(135deg, #eab308 0%, #ca8a04 100%)';
            }
            rollBtn.style.background = btnBg;
        }

        soundInput.addEventListener('change', (e) => {
            const file = e.target.files[0]; if (!file) return;
            stopAllSounds();
            if (customAudioUrl) URL.revokeObjectURL(customAudioUrl);
            customAudioUrl = URL.createObjectURL(file);
            customAudio = new Audio(customAudioUrl); customAudio.volume = parseFloat(volumeRange.value);
            const group = document.getElementById('customSoundGroup');
            let customOpt = document.getElementById('customSoundOption');
            if (!customOpt) {
                customOpt = document.createElement('option'); customOpt.id = 'customSoundOption'; customOpt.value = 'custom';
                group.insertBefore(customOpt, group.firstChild);
            }
            customOpt.textContent = `🎵 ${file.name.length > 18 ? file.name.slice(0, 15) + '...' : file.name}`;
            soundSelect.value = 'custom'; lastValidSound = 'custom'; playRollSound('normal');
        });

        bgImageInput.addEventListener('change', (e) => {
            const file = e.target.files[0]; if (!file) return;
            bgVideo.style.display = 'none'; bgVideo.src = '';
            const url = URL.createObjectURL(file); const key = 'bg_' + Date.now();
            savedBackgrounds[key] = { type: 'image', url: url };
            document.body.style.background = `url('${url}') center / cover no-repeat fixed`;
            const group = document.getElementById('customBgsGroup');
            const newOpt = document.createElement('option'); newOpt.value = key; newOpt.textContent = `🖼️ ${file.name.slice(0, 16)}`;
            group.insertBefore(newOpt, group.firstChild);
            themeSelect.value = key; lastValidTheme = key; bgImageInput.value = '';
        });

        bgVideoInput.addEventListener('change', (e) => {
            const file = e.target.files[0]; if (!file) return;
            document.body.style.background = '#060913';
            const url = URL.createObjectURL(file); const key = 'bg_' + Date.now();
            savedBackgrounds[key] = { type: 'video', url: url };
            bgVideo.src = url; bgVideo.style.display = 'block';
            const group = document.getElementById('customBgsGroup');
            const newOpt = document.createElement('option'); newOpt.value = key; newOpt.textContent = `🎬 ${file.name.slice(0, 16)}`;
            group.insertBefore(newOpt, group.firstChild);
            themeSelect.value = key; lastValidTheme = key; bgVideoInput.value = '';
        });

        applyTheme('space');
        rollDice(false, 'fast', false);
    </script>
</body>
</html>
